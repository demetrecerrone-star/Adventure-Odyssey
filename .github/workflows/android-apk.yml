name: Build Adventure Odyssey Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    # Pushes inspect the archived Godot source without generating another APK.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Inspect archived title scene and sprites
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part_*.bin > /tmp/adventure_odyssey_source.zip
          echo "861c1871c327126a1321ef0107341dbe3510cfa60cf1f0f00abac14592edb568  /tmp/adventure_odyssey_source.zip" | sha256sum -c -
          unzip -qo /tmp/adventure_odyssey_source.zip -d .
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
          fi
          python3 tools/apply_title_screen.py
          python3 tools/apply_dabsky_title.py
          python3 tools/apply_creator_improvements.py
          python3 tools/apply_creator_palette.py
          echo '=== CHARACTER CREATOR AUDIT SOURCE ==='
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('scripts/game.gd').read_text().splitlines()
          headers = [(i, line) for i, line in enumerate(lines) if line.startswith('func ') or line.startswith('static func ')]
          keys = ('creat', 'class', 'hair', 'skin', 'eye', 'character', 'save', 'load', 'stat', 'preview', 'body', 'variant', 'appearance', 'confirm', 'portrait', 'sex', 'gender', 'world', 'player', 'continue', 'frame', 'move', 'equip', 'level', 'random')
          for p,(index, header) in enumerate(headers):
              if any(k in header.lower() for k in keys):
                  end = headers[p+1][0] if p+1 < len(headers) else len(lines)
                  print(f'=== FUNCTION {header} lines {index+1}-{end} ===')
                  for line_no in range(index, end):
                      print(f'{line_no+1:04d}: {lines[line_no]}')
          print('=== GAME GLOBALS ===')
          for index,line in enumerate(lines[:165]):
              print(f'{index+1:04d}: {line}')
          print('=== SPRITE / CLOTHING ASSETS ===')
          for path in sorted(Path('assets').rglob('*.png')):
              if any(k in str(path).lower() for k in ('eyes', 'eye_', 'clothing', 'outfit', 'armor', 'body', 'character', 'hair')):
                  print(str(path))
          print('=== SMOKE TEST ===')
          for index,line in enumerate(Path('tests/smoke_test.gd').read_text().splitlines()):
              print(f'{index+1:04d}: {line}')
          PY
          grep -q 'func _title_button' scripts/game.gd
          test -s assets/ui/dabsky_logo.webp
          echo '=== Relevant project files ==='
          find . -maxdepth 6 -type f \( -name '*.tscn' -o -name '*.gd' -o -name '*.png' \) | sort | head -220
          echo '=== Title / login / sprite references ==='
          grep -RniE 'title|login|guest|skeleton|goblin|character.creat|sprite_frames' --include='*.gd' --include='*.tscn' . | head -150 || true
          echo '=== Candidate scripts and scenes ==='
          find . -maxdepth 6 -type f \( -iname '*title*.gd' -o -iname '*title*.tscn' -o -iname '*menu*.gd' -o -iname '*menu*.tscn' -o -iname '*login*.gd' -o -iname '*login*.tscn' -o -iname '*main*.gd' -o -iname '*main*.tscn' \) | sort | while read -r file; do
            echo "=== FILE: $file ==="
            sed -n '1,280p' "$file"
          done
          echo '=== Project startup config ==='
          sed -n '1,180p' project.godot
          echo '=== Title image properties ==='
          file assets/world/title.png
  validate-title:
    # Validate the actual unpacked Godot game but do not export Android.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Reconstruct source and apply title layout
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part_*.bin > /tmp/adventure_odyssey_source.zip
          echo "861c1871c327126a1321ef0107341dbe3510cfa60cf1f0f00abac14592edb568  /tmp/adventure_odyssey_source.zip" | sha256sum -c -
          unzip -qo /tmp/adventure_odyssey_source.zip -d .
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
          fi
          python3 tools/apply_title_screen.py
          python3 tools/apply_dabsky_title.py
          python3 tools/apply_creator_improvements.py
          python3 tools/apply_creator_palette.py
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
      - name: Validate Godot import and game smoke test (no APK)
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tests/smoke_test.gd
          godot --headless --path . --script res://tests/creator_deep_test.gd
      - name: Capture native rendered character creator
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb libgl1-mesa-dri libfontconfig1 libxcursor1 libxi6 libxinerama1 libxkbcommon-x11-0 libwayland-cursor0
          mkdir -p screenshots
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --script res://tests/creator_screenshot.gd
          test -s screenshots/character_creator.png
          ls -lh screenshots/character_creator.png
      - name: Upload visual QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-Odyssey-Character-Creator-Preview
          path: screenshots/character_creator.png
          if-no-files-found: error
          retention-days: 15
  android-apk:
    # Actual APK builds happen only when manually requested.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    timeout-minutes: 35

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Reconstruct and verify Godot project
        shell: bash
        run: |
          set -euo pipefail
          test "$(find payload -name 'part_*.bin' | wc -l)" -eq 35
          cat payload/part_*.bin > /tmp/adventure_odyssey_v03.zip
          echo "861c1871c327126a1321ef0107341dbe3510cfa60cf1f0f00abac14592edb568  /tmp/adventure_odyssey_v03.zip" | sha256sum -c -
          unzip -qo /tmp/adventure_odyssey_v03.zip -d .
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
          fi
          python3 tools/apply_title_screen.py
          python3 tools/apply_dabsky_title.py
          python3 tools/apply_creator_improvements.py
          python3 tools/apply_creator_palette.py
          test -f project.godot
          test -f export_presets.cfg
          test -f assets/world/title.png
          test -s assets/ui/dabsky_logo.webp
          # Android requires ETC2/ASTC enabled even with the GL Compatibility renderer.
          # The archived project predates this export setting, so patch it immediately after unpacking.
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          grep -F 'textures/vram_compression/import_etc2_astc=true' project.godot
          mkdir -p build

      - name: Set up Android export environment
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          java -version
          test -f project.godot
          test -f export_presets.cfg
          test -f assets/world/title.png
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config" build
          # Godot-CI preinstalls templates and editor settings for root. In
          # GitHub Actions containers HOME may be /github/home instead.
          if [[ -d /root/.local/share/godot/export_templates/4.7.2.stable && \
                ! -d "$HOME/.local/share/godot/export_templates/4.7.2.stable" ]]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable \
              "$HOME/.local/share/godot/export_templates/"
          fi
          if [[ -d /root/.config/godot && ! -d "$HOME/.config/godot" ]]; then
            cp -a /root/.config/godot "$HOME/.config/godot"
          fi
          test -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          ls -l "$HOME/.local/share/godot/export_templates/4.7.2.stable/" | head -20

      - name: Import assets and validate scenes
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tests/smoke_test.gd
          godot --headless --path . --script res://tests/creator_deep_test.gd

      - name: Build signed Android APK
        shell: bash
        env:
          AO_RELEASE_KEYSTORE_BASE64: ${{ secrets.AO_RELEASE_KEYSTORE_BASE64 }}
          AO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AO_RELEASE_KEYSTORE_PASSWORD }}
          AO_RELEASE_KEY_ALIAS: ${{ secrets.AO_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/adventure_odyssey_release.jks /tmp/ao_debug.keystore' EXIT
          if [[ -n "${AO_RELEASE_KEYSTORE_BASE64:-}" && \
                -n "${AO_RELEASE_KEYSTORE_PASSWORD:-}" && \
                -n "${AO_RELEASE_KEY_ALIAS:-}" ]]; then
            umask 077
            printf '%s' "$AO_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/adventure_odyssey_release.jks
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/adventure_odyssey_release.jks
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$AO_RELEASE_KEY_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$AO_RELEASE_KEYSTORE_PASSWORD"
            echo 'Exporting release APK using permanent signing key'
            godot --headless --path . --export-release Android build/Adventure-Odyssey-release.apk
          else
            echo 'Signing secrets not configured. Building DEBUG TEST APK only.'
            keytool -genkeypair -noprompt -keystore /tmp/ao_debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname 'CN=Android Debug,O=Adventure Odyssey,C=US'
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/ao_debug.keystore
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
            godot --headless --path . --export-debug Android build/Adventure-Odyssey-debug.apk
          fi
          APK="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee build/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-Odyssey-Android-APK
          path: |
            build/*.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
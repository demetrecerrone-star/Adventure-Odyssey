      - name: Build signed Android APK
        shell: bash
        env:
          AO_RELEASE_KEYSTORE_BASE64: ${{ secrets.AO_RELEASE_KEYSTORE_BASE64 }}
          AO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AO_RELEASE_KEYSTORE_PASSWORD }}
          AO_RELEASE_KEY_ALIAS: ${{ secrets.AO_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/adventure_odyssey_release.jks /tmp/ao_debug.keystore' EXIT
          if [[ -n "${AO_RELEASE_KEYSTORE_BASE64:-}" && \
                -n "${AO_RELEASE_KEYSTORE_PASSWORD:-}" && \
                -n "${AO_RELEASE_KEY_ALIAS:-}" ]]; then
            umask 077
            printf '%s' "$AO_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/adventure_odyssey_release.jks
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/adventure_odyssey_release.jks
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$AO_RELEASE_KEY_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$AO_RELEASE_KEYSTORE_PASSWORD"
            echo 'Exporting release APK using permanent signing key'
            godot --headless --path . --export-release Android build/Adventure-Odyssey-release.apk
          else
            echo 'Signing secrets not configured. Building DEBUG TEST APK only.'
            keytool -genkeypair -noprompt -keystore /tmp/ao_debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname 'CN=Android Debug,O=Adventure Odyssey,C=US'
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/ao_debug.keystore
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
            godot --headless --path . --export-debug Android build/Adventure-Odyssey-debug.apk
          fi
          APK="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee build/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-Odyssey-Android-APK
          path: |
            build/*.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
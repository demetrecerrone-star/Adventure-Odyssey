name: Validate and build Adventure Odyssey bedroom preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title-preview:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    timeout-minutes: 20
    steps:
      - name: Check out direct Godot source
        uses: actions/checkout@v4

      - name: Set up Android export environment
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          java -version
          test -f project.godot
          test -f export_presets.cfg
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config" build
          # Godot-CI preinstalls templates and editor settings for root. In
          # GitHub Actions containers HOME may be /github/home instead.
          if [[ -d /root/.local/share/godot/export_templates/4.7.2.stable && \
                ! -d "$HOME/.local/share/godot/export_templates/4.7.2.stable" ]]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable \
              "$HOME/.local/share/godot/export_templates/"
          fi
          if [[ -d /root/.config/godot && ! -d "$HOME/.config/godot" ]]; then
            cp -a /root/.config/godot "$HOME/.config/godot"
          fi
          test -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          ls -l "$HOME/.local/share/godot/export_templates/4.7.2.stable/" | head -20

      - name: Import direct source and test title interactions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/ao_import.log
          ! grep -Eq 'SCRIPT ERROR|Failed to load script|Parse Error' /tmp/ao_import.log
          timeout 80 godot --headless --path . --script res://tests/title_test.gd 2>&1 | tee /tmp/ao_title_test.log
          grep -Fq 'ADVENTURE ODYSSEY TITLE TEST: PASS' /tmp/ao_title_test.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error' /tmp/ao_title_test.log

      - name: Validate creator, bedroom, and dressed assets
        shell: bash
        run: |
          set -euo pipefail
          for test in creator_test creator_layout_test bedroom_test avatar_playback_test outfit_assets_test appearance_test held_weapon_test hair_test; do
            timeout 100 godot --headless --path . --script "res://tests/${test}.gd" 2>&1 | tee "/tmp/ao_${test}.log"
            grep -Eq 'failures: 0|0 failures' "/tmp/ao_${test}.log"
            ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error' "/tmp/ao_${test}.log"
          done

      - name: Capture native title preview
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 xvfb libgl1-mesa-dri libfontconfig1 libxcursor1 libxi6 libxinerama1 libxkbcommon-x11-0 libwayland-cursor0
          mkdir -p screenshots
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --script res://tests/title_screenshot.gd 2>&1 | tee /tmp/ao_title_capture.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error' /tmp/ao_title_capture.log
          test -s screenshots/title_preview.png
          test -s screenshots/title_signin.png
          test -s screenshots/title_create.png
          test -s screenshots/title_wide.png

      - name: Capture native furnished bedroom
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --script res://tests/bedroom_screenshot.gd 2>&1 | tee /tmp/ao_bedroom_capture.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error' /tmp/ao_bedroom_capture.log
          test -s screenshots/bedroom_play.png
          test -s screenshots/bedroom_chest.png
          test -s screenshots/bedroom_mirror.png

      - name: Capture native full-screen creator
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --script res://tests/creator_screenshot.gd 2>&1 | tee /tmp/ao_creator_capture.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error' /tmp/ao_creator_capture.log
          test -s screenshots/creator_fullscreen.png
          test -s screenshots/creator_landscape.png
          test -s screenshots/creator_keyboard.png
          test -s screenshots/creator_mirror.png

      - name: Capture native skin and eye palettes
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a -s '-screen 0 1200x1200x24' godot --path . --script res://tests/appearance_screenshot.gd 2>&1 | tee /tmp/ao_appearance_capture.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error|Shader compilation failed' /tmp/ao_appearance_capture.log
          test -s screenshots/appearance_palettes.png

      - name: Capture native held Warrior sword pilot
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a -s '-screen 0 1280x1000x24' godot --path . --script res://tests/held_weapon_screenshot.gd 2>&1 | tee /tmp/ao_weapon_capture.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error' /tmp/ao_weapon_capture.log
          test -s screenshots/held_weapon_warrior.png
          test -s screenshots/held_weapon_behind_chest.png
          test -s screenshots/held_weapon_front_chest.png

      - name: Capture native directional hairstyles
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a -s '-screen 0 1200x1200x24' godot --path . --script res://tests/hair_screenshot.gd 2>&1 | tee /tmp/ao_hair_capture.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load script|Parse Error|Shader compilation failed' /tmp/ao_hair_capture.log
          test -s screenshots/hair_six_colors.png
          test "$(find screenshots -name 'hair_*_idle.png' | wc -l)" -eq 6
          test "$(find screenshots -name 'hair_*_walk.png' | wc -l)" -eq 6

      - name: Upload native title preview
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-Odyssey-Title-Preview
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 15

      - name: Build signed Android APK
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-title-apk]')
        shell: bash
        env:
          AO_RELEASE_KEYSTORE_BASE64: ${{ secrets.AO_RELEASE_KEYSTORE_BASE64 }}
          AO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AO_RELEASE_KEYSTORE_PASSWORD }}
          AO_RELEASE_KEY_ALIAS: ${{ secrets.AO_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/adventure_odyssey_release.jks /tmp/AoSigningPreflight.java' EXIT
          if [[ -n "${AO_RELEASE_KEYSTORE_BASE64:-}" && \
                -n "${AO_RELEASE_KEYSTORE_PASSWORD:-}" && \
                -n "${AO_RELEASE_KEY_ALIAS:-}" ]]; then
            umask 077
            if ! printf '%s' "$AO_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/adventure_odyssey_release.jks 2>/dev/null; then
              echo '::error::Signing preflight: keystore secret is not valid Base64.'
              exit 1
            fi
            # JDK keystore API provides precise checks without printing credentials,
            # aliases, key bytes, or raw exception text. Password stays in environment.
            cat > /tmp/AoSigningPreflight.java <<'JAVA'
          import java.io.*;
          import java.nio.file.*;
          import java.security.*;
          import java.util.*;
          class AoSigningPreflight {
            static void fail(String message) {
              System.out.println("::error::Signing preflight: " + message);
              System.exit(1);
            }
            public static void main(String[] args) {
              char[] password = System.getenv("AO_RELEASE_KEYSTORE_PASSWORD").toCharArray();
              try {
                File file = new File("/tmp/adventure_odyssey_release.jks");
                if (!file.isFile() || file.length() == 0) fail("decoded keystore is empty or missing.");
                KeyStore store = null;
                try { store = KeyStore.getInstance(file, password); }
                catch (IOException e) {
                  String text = String.valueOf(e.getMessage()).toLowerCase(Locale.ROOT);
                  if (e.getCause() instanceof UnrecoverableKeyException || text.contains("password") || text.contains("tampered"))
                    fail("keystore could not be unlocked with the configured store password; verify the matching password and file.");
                  fail("decoded file is not a readable JKS/PKCS12 keystore; verify Base64 was made from the actual keystore file.");
                }
                catch (Exception e) { fail("keystore format/provider could not be loaded."); }
                String alias = System.getenv("AO_RELEASE_KEY_ALIAS");
                if (!store.containsAlias(alias)) fail("store password accepted, but the configured alias does not exist in this keystore.");
                if (!store.isKeyEntry(alias)) fail("configured alias is not a private signing-key entry.");
                Key key = null;
                try { key = store.getKey(alias, password); }
                catch (UnrecoverableKeyException e) { fail("store password and alias accepted, but private-key password differs from the configured password."); }
                if (!(key instanceof PrivateKey)) fail("configured entry has no usable private signing key.");
                java.security.cert.Certificate cert = store.getCertificate(alias);
                if (cert == null) fail("signing entry has no certificate.");
                String fingerprint = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(cert.getEncoded()));
                if (!fingerprint.equals("d66e7daf0e5c7c735bf9f1c866afc204e2d0355687ac37d385cf3016e42eac36"))
                  fail("credentials are valid, but this keystore does not match the currently configured release signing identity; use its matching backup.");
                System.out.println("Signing preflight: store password, alias, private key and configured release certificate verified.");
              } catch (Exception e) { fail("unexpected keystore validation failure; no credential details printed."); }
              finally { Arrays.fill(password, '\0'); }
            }
          }
          JAVA
            java /tmp/AoSigningPreflight.java
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/adventure_odyssey_release.jks
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$AO_RELEASE_KEY_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$AO_RELEASE_KEYSTORE_PASSWORD"
            echo 'Exporting release APK using configured release signing key'
            godot --headless --path . --export-release Android build/Adventure-Odyssey-release.apk
          else
            echo '::error::Permanent release signing secrets are missing; refusing a debug or unsigned substitute.'
            exit 1
          fi
          APK="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          # Verify the replacement release signing identity generated on 2026-10-16.
          signer="$(find /usr/lib/android-sdk/build-tools -maxdepth 3 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$APK" | tee build/Release-APK-Signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' build/Release-APK-Signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: d66e7daf0e5c7c735bf9f1c866afc204e2d0355687ac37d385cf3016e42eac36' build/Release-APK-Signature.txt
          ls -lh "$APK"
          sha256sum "$APK" | tee build/SHA256SUMS.txt

      - name: Verify packaged title and bedroom dependencies
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-title-apk]')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import zipfile, pathlib, shutil
          z = zipfile.ZipFile('build/Adventure-Odyssey-release.apk')
          names = z.namelist()
          assert z.testzip() is None, 'APK ZIP CRC failure'
          for asset in ('dusk-kingdom-background', 'adventure-odyssey-wordmark', 'by-dabsky', 'goblin-run', 'skeleton-run', 'body.ttf', 'title.ttf', 'textured_panel'):
              assert any(asset in n for n in names), 'Missing packaged title dependency: ' + asset
          assert any(n.endswith('.ctex') for n in names), 'No imported textures exported'
          root = pathlib.Path('/tmp/ao-packaged-title')
          for name in names:
              if name.startswith('assets/') and not name.endswith('/'):
                  target = root / name[len('assets/'):]
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          shutil.copyfile('project.godot', root / 'project.godot')
          assert any('runtime-layout.json' in n for n in names), 'Missing bedroom layout JSON'
          assert any('character-outfits/manifest.json' in n for n in names), 'Missing outfit manifest'
          print('PACKAGED TITLE DEPENDENCIES: PASS')
          PYTHON
          timeout 80 godot --headless --path /tmp/ao-packaged-title --script "$GITHUB_WORKSPACE/tests/title_test.gd" 2>&1 | tee /tmp/ao_packaged_test.log
          grep -Fq 'ADVENTURE ODYSSEY TITLE TEST: PASS' /tmp/ao_packaged_test.log
          ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load|Parse Error|Error loading' /tmp/ao_packaged_test.log
          for test in bedroom_test avatar_playback_test outfit_assets_test appearance_test held_weapon_test hair_test; do
            timeout 100 godot --headless --path /tmp/ao-packaged-title --script "$GITHUB_WORKSPACE/tests/${test}.gd" 2>&1 | tee "/tmp/ao_packaged_${test}.log"
            grep -Eq 'failures: 0|0 failures' "/tmp/ao_packaged_${test}.log"
            ! grep -Eq 'SCRIPT ERROR|TEST FAILED|Failed to load|Parse Error|Error loading' "/tmp/ao_packaged_${test}.log"
          done

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-title-apk]')
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-Odyssey-Android-APK
          path: |
            build/*.apk
            build/SHA256SUMS.txt
            build/Release-APK-Signature.txt
          if-no-files-found: error
          retention-days: 30


# Isolated QA harness; no Android/export/release steps.
name: Full starter region renderer QA only
on:
  push:
    branches: [main]
    paths: ['qa/starter-region/**', '.github/workflows/starter-region-qa.yml']
permissions:
  contents: read
jobs:
  region-qa:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y xvfb libgl1-mesa-dri libfontconfig1 libxcursor1 libxi6 libxinerama1 libxkbcommon-x11-0 libwayland-cursor0 python3-pil python3-numpy
      - name: Validate assets and headless physics
        working-directory: qa/starter-region
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_assets.py
          godot --headless --path . --script res://src/test.gd 2>&1 | tee results/headless.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' results/headless.log
          python3 -c 'import json; assert not json.load(open("results/headless.json"))["failures"]'
      - name: Capture real renderer output using Mesa software rasterization
        working-directory: qa/starter-region
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 300 xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --script res://src/capture.gd 2>&1 | tee results/capture.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' results/capture.log
          python3 -c 'import json; r=json.load(open("results/render-comparison.json")); assert len(r["comparisons"])==10; assert all(c["pixels_diff_gt_2"]==0 for c in r["comparisons"]),r'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starter-region-qa
          path: qa/starter-region/results/

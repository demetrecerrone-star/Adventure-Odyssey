<path d="M29 89 L51 35 L62 35 L82 89 L68 89 L63 75 L44 75 L39 89 Z M48 64 L59 64 L53.5 48 Z" fill="url(#gold)" stroke="#59320e" stroke-width="2" fill-rule="evenodd"/>
<path d="M60 70 C60 53 72 42 86 42 C100 42 109 53 109 70 C109 87 100 97 85 97 C70 97 60 87 60 70 Z M74 70 C74 80 78 85 85 85 C92 85 96 79 96 70 C96 60 92 54 85 54 C78 54 74 60 74 70 Z" fill="url(#gold)" stroke="#5b360f" stroke-width="2" fill-rule="evenodd"/>
<path d="M84 67 L88 71 L84 75 L80 71 Z" fill="#fff3c1"/>
</svg>

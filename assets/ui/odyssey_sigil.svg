<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<!-- Odyssey Sigil. Transparent blue-and-gold AO coin, inspired by the approved concept sheet. -->
<defs>
 <radialGradient id="blue" cx=".4" cy=".27" r=".79"><stop stop-color="#4777ba"/><stop offset=".6" stop-color="#163e76"/><stop offset="1" stop-color="#092344"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1ae"/><stop offset=".26" stop-color="#e7a94a"/><stop offset=".54" stop-color="#895015"/><stop offset=".79" stop-color="#fcd16a"/><stop offset="1" stop-color="#9a5a20"/></linearGradient>
</defs>
<circle cx="64" cy="64" r="60" fill="#4d2e0b"/>
<circle cx="64" cy="64" r="57" fill="url(#gold)" stroke="#ffe4a1" stroke-width="2"/>
<circle cx="64" cy="64" r="49" fill="#54390f" stroke="#ffe397" stroke-width="1.3"/>
<circle cx="64" cy="64" r="45.5" fill="url(#blue)" stroke="#eaba55" stroke-width="2"/>
<circle cx="64" cy="64" r="38" fill="none" stroke="#ce963f" stroke-width="1.4" opacity=".7"/>
<!-- Compass points stamped on the rim. -->
<path d="M64 8 L68 20 L64 29 L60 20 Z M64 120 L68 108 L64 99 L60 108 Z M8 64 L20 60 L29 64 L20 68 Z M120 64 L108 60 L99 64 L108 68 Z" fill="#fff0a2" stroke="#8c581d" stroke-width="1.4"/>
